[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
# Русский текст в строках и комментариях: проверка «похожих» символов не нужна
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# Промпты — длинные строки текста, переносить их нельзя
"services/prompts.py" = ["E501"]
